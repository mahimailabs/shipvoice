# One-command local stack: Postgres, the token server, the voice worker and the
# console. Uses an EXTERNAL LiveKit project via LIVEKIT_URL (a free LiveKit
# Cloud project works).
#
#   cp .env.example .env        # fill in the six values it asks for
#   docker compose up --build
#
# Then open http://localhost:5173, go to Agents, and hit "Start test call".
#
# The backend brings the schema up to head on startup, so there is no migration
# step. Everything not in .env has a default here or in code.
#
# NOTE: this is the only env file compose reads. The per-service .env files are
# for running those services by hand. And the VITE_ values below are baked into
# the frontend at BUILD time, so changing them needs 'up -d --build', never
# 'restart'.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 8080
      # Defaults so .env only has to carry the six values that need an account.
      ENV: ${ENV:-dev}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-app}
      DB_SSL: ${DB_SSL:-disable}
      CORS_ORIGINS_STR: ${CORS_ORIGINS_STR:-http://localhost:5173}
    ports:
      - "8000:8080" # http://localhost:8000  (docs at /docs)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build: ./agent
    env_file: .env
    environment:
      # Where the worker asks for the LiveKit project. Inside the compose
      # network the backend answers on its container port, not the published one.
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080}
      AGENT_NAME: ${AGENT_NAME:-assistant}
    volumes:
      # The persona is data. Mounting it means editing the prompt is a restart,
      # not an image rebuild.
      - ./agent/prompts:/app/prompts:ro
    # The worker asks the backend for the LiveKit project at startup and
    # restarts itself when it changes there. 'restart: unless-stopped' is what
    # turns that restart into a running worker again, so keep it.
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TOKEN_ENDPOINT: ${VITE_TOKEN_ENDPOINT:-http://localhost:8000/api/v1/token}
        # Must equal AGENT_NAME above. If they differ, LiveKit never dispatches
        # the worker: the room opens, the token is valid, and nothing speaks.
        VITE_AGENT_NAME: ${VITE_AGENT_NAME:-${AGENT_NAME:-assistant}}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80" # http://localhost:5173
    depends_on:
      - backend

volumes:
  pgdata:
